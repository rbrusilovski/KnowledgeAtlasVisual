# PRODUCTION. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# - Postgres and Redis publish NO host ports and sit on an internal-only network (`data`, no egress).
# - Every secret is required: compose refuses to start when one is missing (${VAR:?}); nothing is hard-coded.
# - Redis requires a password. Only `web` publishes a port (bind it behind your TLS reverse proxy).
# - The worker needs outbound HTTPS (YouTube Data API, embedding-model download) and joins the `egress` network.
# Deploy, rollback and backups: docs/OPERATIONS.md.
name: atlas-prod

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atlas}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: { context: ., target: web }
    image: ${ATLAS_IMAGE:-atlas}:${ATLAS_TAG:-latest}-web
    restart: unless-stopped
    env_file: ${ATLAS_ENV_FILE:-.env.production}
    environment: *app-env
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks: [data, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: { context: ., target: worker }
    image: ${ATLAS_IMAGE:-atlas}:${ATLAS_TAG:-latest}-worker
    restart: unless-stopped
    env_file: ${ATLAS_ENV_FILE:-.env.production}
    environment: *app-env
    networks: [data, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

networks:
  data:
    internal: true
  egress: {}

volumes:
  pgdata:
  redisdata:
