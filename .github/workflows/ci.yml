name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas
  TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_test
  REDIS_URL: redis://localhost:6379
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  BETTER_AUTH_URL: http://localhost:3000
  ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXMtbG9uZyE=
  YOUTUBE_MODE: fixture
  EMBEDDING_PROVIDER: hash
  DEMO_USER_PASSWORD: ci-demo-password
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: atlas, POSTGRES_PASSWORD: atlas, POSTGRES_DB: atlas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Prisma drift check
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: No secrets in the client bundle
        # Secret VALUES must never appear; server-only key names must not either. (Better Auth's isomorphic env
        # getter mentions the name BETTER_AUTH_SECRET but resolves to undefined in the browser.)
        run: |
          ! grep -rlF -e "$BETTER_AUTH_SECRET" -e "$ENCRYPTION_KEY" -e "$DEMO_USER_PASSWORD" .next/static
          ! grep -rlE "YOUTUBE_API_KEY|ANTHROPIC_API_KEY|ENCRYPTION_KEY|GOOGLE_CLIENT_SECRET|GITHUB_CLIENT_SECRET|DATABASE_URL|REDIS_URL" .next/static
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
