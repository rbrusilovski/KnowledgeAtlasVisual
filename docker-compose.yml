# DEVELOPMENT ONLY. Local Postgres + Redis for `pnpm dev`, tests and e2e.
# Ports are bound to 127.0.0.1 so nothing on the network can reach them, and the fixed `atlas/atlas` credentials are
# for this local container only. Production uses docker-compose.prod.yml (no published DB/Redis ports, required
# secrets, Redis auth) — see docs/OPERATIONS.md.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  redisdata:
